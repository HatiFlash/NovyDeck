name: Windows build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify plugin fixture runtime
        run: node -e "if (typeof WebSocket !== 'function') process.exit(1)"
      - name: Formatting (cargo fmt, C-02)
        run: cargo fmt --check
      - name: Build native executables
        run: cargo build --release --locked
      - name: Clippy (C-05 ; erreurs bloquantes, avertissements de style signalés)
        run: cargo clippy --release --locked --all-targets
      - name: Rust and headless MCP tests
        timeout-minutes: 15
        env:
          DECKFORGE_MCP_EXE: ${{ github.workspace }}\target\release\novydeck-mcp.exe
        shell: pwsh
        run: ./tools/ci-test.ps1
      - name: MCP stdio transport
        run: node tests/mcp-transport.cjs
      - name: MCP HTTP transport
        run: node tests/mcp-http.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NovyDeck-Windows
          path: |
            target/release/novydeck.exe
            target/release/novydeck-mcp.exe
            LICENSE
            THIRD-PARTY-NOTICES.txt
            README.md
            docs/MCP.md
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency advisories (cargo audit, failles connues = échec)
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          cargo audit
