name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build native executables
        run: cargo build --release --locked
      - name: Rust and headless MCP tests
        timeout-minutes: 20
        env:
          DECKFORGE_MCP_EXE: ${{ github.workspace }}\target\release\novydeck-mcp.exe
        shell: pwsh
        run: ./tools/ci-test.ps1
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $name = "NovyDeck-$version"
          New-Item -ItemType Directory -Force dist/$name/docs | Out-Null
          Copy-Item target/release/novydeck.exe, target/release/novydeck-mcp.exe, LICENSE, THIRD-PARTY-NOTICES.txt, README.md dist/$name/
          # Compatibility aliases keep existing shortcuts / MCP clients working after a portable upgrade.
          Copy-Item target/release/novydeck.exe dist/$name/deckforge.exe
          Copy-Item target/release/novydeck-mcp.exe dist/$name/deckforge-mcp.exe
          Copy-Item docs/MCP.md, docs/PLUGINS-COMPATIBILITE.md, docs/DESIGN.md dist/$name/docs/
          Copy-Item docs/images -Destination dist/$name/docs/images -Recurse
          Copy-Item docs/media -Destination dist/$name/docs/media -Recurse
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name-Windows.zip
          git archive --format=zip --prefix="$name/" -o dist/$name-source.zip HEAD
          Copy-Item docs/media/novydeck-demo.mp4 dist/$name-Presentation.mp4
          $hashes = [ordered]@{}
          foreach ($f in (Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.mp4' })) { $hashes[$f.Name] = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() }
          $hashes | ConvertTo-Json | Set-Content -Encoding utf8 dist/$name-sha256.json
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Windows installer (Inno Setup)
        shell: pwsh
        run: |
          # Version d'Inno Setup figée et vérifiée (audit S-10) : pas d'ISCC préinstallé ni de paquet choco flottant.
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.4.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw "Empreinte Inno Setup inattendue : $hash" }
          $dir = "$env:RUNNER_TEMP\InnoSetup674"
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Installation d'Inno Setup 6.7.4 en échec" }
          ./tools/Build-Installer.ps1 -Version $env:VERSION -Iscc "$dir\ISCC.exe"
          Copy-Item "target/release-dist/NovyDeck-$env:VERSION-Setup.exe", "target/release-dist/NovyDeck-$env:VERSION-Setup.exe.sha256" dist/
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/RELEASE-$env:VERSION.md"
          if (-not (Test-Path $notes)) { $notes = "README.md" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist -File).FullName --title "NovyDeck $env:VERSION" --notes-file $notes --verify-tag
